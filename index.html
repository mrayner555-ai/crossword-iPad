<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Weekly Cryptic Crossword</title>
<style>
:root{color-scheme:light;--blue:#2467ac;--active:#d3e9ff;--cross:#edf5ff}*{box-sizing:border-box}body{margin:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#17191d;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column;padding:8px;gap:6px}.main{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);gap:8px}.clues{min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:7px}.clue-pane{min-height:0;background:#fff;border:1px solid #ddd;border-radius:7px;display:flex;flex-direction:column;overflow:hidden}.clue-pane h2{font-size:15px;margin:0;padding:8px 10px;background:#e8ecf2;border-bottom:1px solid #ddd}.clue-list{overflow:auto;overscroll-behavior:contain;padding:5px}.clue{font-size:clamp(11px,1.08vw,16px);line-height:1.24;padding:5px 6px;border-radius:5px;cursor:pointer;margin:1px 0}.clue b{margin-right:4px}.clue.selected{background:var(--active);outline:1px solid #98c4ee}.clue.done{color:#999}.board-area{min-height:0;display:flex;align-items:center;justify-content:center}.grid{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);aspect-ratio:1/1;width:min(100%,calc(100dvh - 163px));max-height:100%;border:2px solid #161616;background:#121212;touch-action:manipulation}.cell{min-width:0;min-height:0;position:relative;border:1px solid #444;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.cell.black{background:#111;border-color:#111;cursor:default}.cell.active{background:var(--active)}.cell.cross{background:var(--cross)}.cell.focus{background:#7cb8f3!important}.num{position:absolute;top:1px;left:2px;font-size:clamp(7px,.75vw,12px);font-weight:bold;line-height:1}.letter{font-size:clamp(13px,1.45vw,22px);font-weight:600;line-height:1;transform:translateY(2px)}.bottom{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px}.current{width:100%;min-height:20px;text-align:center;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.keyrows{width:min(100%,750px);display:flex;flex-direction:column;gap:4px}.keyrow{display:flex;justify-content:center;gap:4px}.key{height:36px;flex:1;max-width:62px;border:1px solid #b5bfca;border-radius:5px;background:white;color:#19202a;font-size:17px;font-weight:600;touch-action:manipulation}.key:active{background:#d5e9ff}.key.special{max-width:86px;font-size:12px;background:#e6e9ef}.toolbar{display:flex;gap:7px;align-items:center;justify-content:center}.toolbar button{border:1px solid #bbc1c9;border-radius:5px;background:white;padding:4px 10px;font-size:12px}.toolbar .warning{color:#a43131}@media(max-width:750px) and (orientation:portrait){.main{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.board-area{grid-row:1}.clues{grid-row:2;max-height:27vh}.grid{width:min(100%,44dvh)}}@media(max-height:650px){.grid{width:min(100%,calc(100dvh - 135px))}.key{height:28px}.clue{padding:3px 5px}.app{padding:5px;gap:3px}.current{min-height:16px}}
</style></head><body><div class="app"><div class="main"><div class="clues"><section class="clue-pane"><h2>Across</h2><div class="clue-list" id="across"></div></section><section class="clue-pane"><h2>Down</h2><div class="clue-list" id="down"></div></section></div><div class="board-area"><div class="grid" id="grid" aria-label="Crossword grid"></div></div></div><div class="bottom"><div class="current" id="current"></div><div class="keyrows" id="keyboard"></div><div class="toolbar"><button id="toggle">Across / Down</button><button id="erase">Clear word</button><button class="warning" id="reset">Clear all</button></div></div></div>
<script>
const pattern=["###......#....#",".#.#.#.#.#.##.#",".....#.........",".#.#.#.#.#.#.#.",".......#.......",".#.#.#.###.#.#.","....#..........","##.#.#.#.#.#.##","..........#....",".#.#.###.#.#.#.",".......#.......",".#.#.#.#.#.#.#.",".........#.....","#.##.#.#.#.#.#.","#....#......###"];
const across={1:'Top opening to book, a contemptible one (6)',5:'Irish dramatist and critic is certainly outspoken (4)',9:'Leading male starring in a commercial (5)',10:'Arguer is backed up in unfriendly case (9)',13:'One after another joining in for every launch? (7)',14:'Part of label - a sticky strip of flexible material (7)',15:'Alcohol served with soft cut of meat (4)',16:'Mortified band of criminals worked on user (10)',19:'Doctor primarily is looking after swelling (10)',20:'Become embarrassed shedding a little blood (4)',23:'Irregular writ was first turned around (7)',25:"One who's pragmatic about a tip (7)",26:'Thinking back, detective expressed regret entering tip (9)',28:'Challenge closing of club just before large party (5)',29:"Country's computer system died (4)",30:'Play in water with canoe (6)'};
const down={2:'Run from large snake (6)',3:'Where hieroglyphics may be filed together with secret? (9)',4:'Come after men not declaring millions, and prosecute (5)',5:"A treatment applied to the cargo of ship's food (8)",6:'Asian capital is at present in recession (3)',7:'Nuts piled up for a bush bread (6)',8:'School teacher in nice mood refused to retire? (12)',11:'Huge starter taken away from epicurean (12)',12:'Approaches assessment from a sound perspective (5)',17:'Green tea, blended and blended, ultimately is made (9)',18:'Study containing rocky isle is completed (8)',19:"Get rid of dog's head irritation (5)",21:'One or the other number divided by one? (6)',22:'Side dish, say, mostly served with stewed lamb (6)',24:'Discover sawn-off weapon buried in hollow (3,2)',27:'Unfavourable legal document lacking an introductory section (3)'};
const cells={},entries={across:{},down:{}};let number=0;for(let r=0;r<15;r++)for(let c=0;c<15;c++){if(pattern[r][c]==='#')continue;const a=(c===0||pattern[r][c-1]==='#')&&c<14&&pattern[r][c+1]!=='#';const d=(r===0||pattern[r-1][c]==='#')&&r<14&&pattern[r+1][c]!=='#';const idx=r*15+c;if(a||d)number++;cells[idx]={r,c,num:(a||d)?number:null};if(a){let ids=[];for(let x=c;x<15&&pattern[r][x]!== '#';x++)ids.push(r*15+x);entries.across[number]=ids}if(d){let ids=[];for(let y=r;y<15&&pattern[y][c]!=='#';y++)ids.push(y*15+c);entries.down[number]=ids}}
const grid=document.getElementById('grid'),savedKey='stickley-crossword-2026-11-05';let letters={};try{letters=JSON.parse(localStorage.getItem(savedKey)||'{}')}catch(e){}let dir='across',selected=1,focus=entries.across[1][0];const els={},clueEls={across:{},down:{}};
for(let i=0;i<225;i++){let el=document.createElement('div');el.className='cell'+(!cells[i]?' black':'');if(cells[i]){if(cells[i].num){let n=document.createElement('span');n.className='num';n.textContent=cells[i].num;el.append(n)}let l=document.createElement('span');l.className='letter';l.textContent=letters[i]||'';el.append(l);el.addEventListener('click',()=>clickCell(i));els[i]=el}grid.append(el)}
for(const d of ['across','down'])for(const [n,clue] of Object.entries(d==='across'?across:down)){let el=document.createElement('div');el.className='clue';el.innerHTML='<b>'+n+'</b>'+clue;el.addEventListener('click',()=>choose(d,Number(n)));document.getElementById(d).append(el);clueEls[d][n]=el}
function clickCell(i){if(i===focus&&findEntry(dir,i)){const other=dir==='across'?'down':'across';if(findEntry(other,i))dir=other}let n=findEntry(dir,i);if(!n){dir=dir==='across'?'down':'across';n=findEntry(dir,i)}if(n){selected=n;focus=i;render()}}
function findEntry(d,i){for(const [n,ids] of Object.entries(entries[d]))if(ids.includes(i))return Number(n);return null}
function choose(d,n){dir=d;selected=n;focus=entries[d][n].find(i=>!letters[i])??entries[d][n][0];render()}
function render(){const ids=entries[dir][selected]||[];for(const [s,el]of Object.entries(els)){let i=Number(s);el.classList.toggle('active',ids.includes(i));el.classList.toggle('cross',!ids.includes(i)&&i===focus);el.classList.toggle('focus',i===focus);el.querySelector('.letter').textContent=letters[i]||''}for(const d of ['across','down'])for(const [n,el]of Object.entries(clueEls[d])){el.classList.toggle('selected',d===dir&&Number(n)===selected);el.classList.toggle('done',entries[d][n].every(i=>letters[i]))}document.getElementById('current').textContent=selected+' '+dir.toUpperCase()+' · '+(dir==='across'?across:down)[selected];localStorage.setItem(savedKey,JSON.stringify(letters))}
function typeKey(k){const ids=entries[dir][selected];let pos=ids.indexOf(focus);if(k==='BACK'){if(letters[focus])delete letters[focus];else if(pos>0){focus=ids[pos-1];delete letters[focus]}}else if(k==='SPACE'){if(pos<ids.length-1)focus=ids[pos+1]}else if(/^[A-Z]$/.test(k)){letters[focus]=k;if(pos<ids.length-1)focus=ids[pos+1]}render()}
for(const keys of ['QWERTYUIOP','ASDFGHJKL','ZXCVBNM']){let row=document.createElement('div');row.className='keyrow';if(keys==='ZXCVBNM')addKey(row,'⌫','BACK',true);for(const k of keys)addKey(row,k,k);if(keys==='ZXCVBNM')addKey(row,'NEXT','SPACE',true);document.getElementById('keyboard').append(row)}function addKey(row,label,value,special=false){let b=document.createElement('button');b.className='key'+(special?' special':'');b.textContent=label;b.addEventListener('click',()=>typeKey(value));row.append(b)}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;let k=e.key.toUpperCase();if(/^[A-Z]$/.test(k)){e.preventDefault();typeKey(k)}else if(k==='BACKSPACE'||k==='DELETE'){e.preventDefault();typeKey('BACK')}else if(k==='TAB'){e.preventDefault();nextClue()}else if(k===' '){e.preventDefault();typeKey('SPACE')}else if(k.startsWith('ARROW')){e.preventDefault();let nd=(k==='ARROWLEFT'||k==='ARROWRIGHT')?'across':'down';if(nd!==dir){let n=findEntry(nd,focus);if(n){dir=nd;selected=n}}else{let ids=entries[dir][selected],p=ids.indexOf(focus),delta=(k==='ARROWLEFT'||k==='ARROWUP')?-1:1;focus=ids[Math.max(0,Math.min(ids.length-1,p+delta))]}render()}});
function nextClue(){let nums=Object.keys(entries[dir]).map(Number),p=nums.indexOf(selected);choose(dir,nums[(p+1)%nums.length])}document.getElementById('toggle').onclick=()=>{let other=dir==='across'?'down':'across',n=findEntry(other,focus);if(n)choose(other,n);else choose(other,Number(Object.keys(entries[other])[0]))};document.getElementById('erase').onclick=()=>{for(const i of entries[dir][selected])delete letters[i];focus=entries[dir][selected][0];render()};document.getElementById('reset').onclick=()=>{if(confirm('Clear all your answers?')){letters={};render()}};render();
</script></body></html>
